name: Loomex macOS Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} DMG
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          declared="$(python3 -c 'import json; print(json.load(open("crates/loomex-tauri/tauri.conf.json"))["version"])')"
          expected="${GITHUB_REF_NAME#desktop-v}"
          test "$declared" = "$expected" || {
            echo "Tauri version $declared does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Build unsigned DMG
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p loomex-cli --target ${{ matrix.target }}
          mkdir -p crates/loomex-tauri/binaries
          cp "target/${{ matrix.target }}/release/loomex" crates/loomex-tauri/binaries/loomex
          chmod 755 crates/loomex-tauri/binaries/loomex
          cargo tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Normalize release artifact
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "loomex-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "loomex-macos-${{ matrix.arch }}.dmg" > "loomex-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: loomex-macos-${{ matrix.arch }}
          path: |
            loomex-macos-${{ matrix.arch }}.dmg
            loomex-macos-${{ matrix.arch }}.dmg.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: loomex-macos-*
          merge-multiple: true
          path: release
      - name: Include macOS installer
        run: cp scripts/install-macos.sh release/install-macos.sh && chmod 755 release/install-macos.sh
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Loomex Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
