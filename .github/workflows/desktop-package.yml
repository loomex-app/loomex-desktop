name: Desktop Package Validation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: dmg
          - os: windows-latest
            target: nsis
          - os: ubuntu-latest
            target: deb
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Build desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p loomex-cli
          mkdir -p crates/loomex-tauri/binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/loomex.exe crates/loomex-tauri/binaries/loomex.exe
          else
            cp target/release/loomex crates/loomex-tauri/binaries/loomex
            chmod 755 crates/loomex-tauri/binaries/loomex
          fi
          cargo tauri build --bundles ${{ matrix.target }}
